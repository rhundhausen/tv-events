baseURL = '/'
locale = 'en-us'
title = 'WeekendBoise'
disableKinds = ['taxonomy', 'term', 'rss', 'sitemap']

# Events come from the repo-level data/ folder, so ingestion never writes into this tree.
[module]
  [[module.mounts]]
    source = 'content'
    target = 'content'
  [[module.mounts]]
    source = 'layouts'
    target = 'layouts'
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = 'data'
    target = 'data'
  [[module.mounts]]
    source = '../data'
    target = 'data'
  # The source list, for the sources page and the header count.
  [[module.mounts]]
    source = '../ingestion/sources.json'
    target = 'data/sources.json'
