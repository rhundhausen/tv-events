        "thumbnail": "/media/t43pgom2/artshistory-grants2022-social_indigo-facebook.png?rxy=0.1980328126713053,0.4618138424821002&amp;v=1dd6616d7125740",
        "bodyHTML": "&lt;p&gt;Family Boogie classes are designed for toddlers through preschool age kids to joyfully dance alongside their grown ups! New babies up to elementary age kiddos are also encouraged to join the fun. In fact, kids (and their grown ups) of any age who want to be silly, playful, and creative should totally join this class!&lt;/p&gt;\n&lt;p&gt;So grab your grandparents, moms, dads, siblings, cousins, aunts, uncles, friends &amp;amp; neighbors to all boogie together! These classes are inclusive and intergenerational, just like our non-profit dance company - Open Arms Dance Project. In everything we do, our mission is to create greater joy and compassion with dance that opens hearts, minds, and arms.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Participants will learn:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Fun games that explores the dance space and often animal movements too&lt;/li&gt;\n&lt;li&gt;A circle or square dance&lt;/li&gt;\n&lt;li&gt;BrainDance through rhymes and interactive adult/child movement&lt;/li&gt;\n&lt;li&gt;Locomotion around the dance space like a train, car, or bus&lt;/li&gt;\n&lt;li&gt;Free playing with musical instruments to explore rhythm&lt;/li&gt;\n&lt;li&gt;An obstacle course with plenty of crawling, slithering, jumping, spinning, and galloping about!&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&amp;nbsp;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Arts &amp;amp; History Grant Program&lt;/strong&gt;&lt;br&gt;The City of Boise\u2019s Arts &amp;amp; History Grant program funds quality arts, history, and cultural projects that benefit people living in Boise city limits. Since 1997, the city has awarded over 500 grants with a total disbursement of over $2.1 million. Follow along using #AHGrant.&lt;/p&gt;",
        "bodyText": "Family Boogie classes are designed for toddlers through preschool age kids to joyfully dance alongside their grown ups! New babies up to elementary age kiddos are also encouraged to join the fun. In fact, kids (and their grown ups) of any age who want to be silly, playful, and creative should totally join this class!\nSo grab your grandparents, moms, dads, siblings, cousins, aunts, uncles, friends &amp;amp; neighbors to all boogie together! These classes are inclusive and intergenerational, just like our non-profit dance company - Open Arms Dance Project. In everything we do, our mission is to create greater joy and compassion with dance that opens hearts, minds, and arms.\nParticipants will learn:\nFun games that explores the dance space and often animal movements too\nA circle or square dance\nBrainDance through rhymes and interactive adult/child movement\nLocomotion around the dance space like a train, car, or bus\nFree playing with musical instruments to explore rhythm\nAn obstacle course with plenty of crawling, slithering, jumping, spinning, and galloping about!\nArts &amp;amp; History Grant Program\nThe City of Boise\u2019s Arts &amp;amp; History Grant program funds quality arts, history, and cultural projects that benefit people living in Boise city limits. Since 1997, the city has awarded over 500 grants with a total disbursement of over $2.1 million. Follow along using #AHGrant.",

        "eventImage": "http://jamescastlehouse.org/media/1746/img_0585.jpg",
        "thumbnail": "http://jamescastlehouse.org/media/1746/img_0585.jpg",
        "bodyHTML": "&lt;p&gt;\u00a0&lt;/p&gt;\n&lt;p class=\"isSelectedEnd\"&gt;&lt;span&gt;We hope you\u2019ll join curator Jeffrey Mansfield on November 10 from 6\u20138 p.m. at JUMP for a special presentation exploring the making of &lt;/span&gt;&lt;em&gt;&lt;span&gt;Place &amp;amp; Perception&lt;/span&gt;&lt;/em&gt;&lt;span&gt;, the current exhibition at James Castle House.&lt;/span&gt;&lt;/p&gt;\n&lt;h3&gt;&lt;span&gt;About the Event&lt;/span&gt;&lt;/h3&gt;\n&lt;p class=\"isSelectedEnd\"&gt;&lt;span&gt;How does an exhibition come together? Join &lt;strong&gt;Jeffrey Mansfield&lt;/strong&gt;, curator of &lt;/span&gt;&lt;a rel=\"noopener noreferrer\" href=\"//jamescastlehouse.org/whats-on/exhibitions/\" target=\"_blank\"&gt;&lt;em&gt;&lt;span&gt;Place &amp;amp; Perception&lt;/span&gt;&lt;/em&gt;&lt;/a&gt;&lt;span&gt;, for an inside look at the ideas, research, and curatorial decisions that shaped the exhibition.&lt;/span&gt;&lt;/p&gt;\n&lt;p class=\"isSelectedEnd\"&gt;&lt;span&gt;In this engaging presentation, Jeffrey will share his approach to curating &lt;/span&gt;&lt;em&gt;&lt;span&gt;Place &amp;amp; Perception&lt;/span&gt;&lt;/em&gt;&lt;span&gt; and explore how the exhibition invites audiences to consider James Castle\u2019s work through the\u00a0intertwined legacies of the American West, Deafness (and disability), and modernity, alongside the many real and imagined experiences that emerge from them.\u00a0Following the presentation, attendees are invited to stay for informal conversation and mingling. &lt;a rel=\"noopener noreferrer\" href=\"https://modelofarchitecture.org/people/jeffrey-mansfield\" target=\"_blank\"&gt;Learn more about Jeffrey HERE.\u00a0&lt;/a&gt;&lt;/span&gt;&lt;/p&gt;\n&lt;h3&gt;&lt;span&gt;Event Details&lt;/span&gt;&lt;/h3&gt;\n&lt;p class=\"isSelectedEnd\"&gt;&lt;strong&gt;&lt;span&gt;Date:&lt;/span&gt;&lt;/strong&gt;&lt;span&gt; November 10, 2026&lt;/span&gt;&lt;br&gt;&lt;strong&gt;&lt;span&gt;Time:&lt;/span&gt;&lt;/strong&gt;&lt;span&gt;\u00a06\u20138 p.m.&lt;/span&gt;&lt;br&gt;&lt;strong&gt;&lt;span&gt;Location:&lt;/span&gt;&lt;/strong&gt;&lt;span&gt; JUMP, JUMP Room&lt;/span&gt;&lt;br&gt;&lt;span&gt;1000 W. Myrtle St., Boise, ID 83702&lt;/span&gt;&lt;/p&gt;\n&lt;p class=\"isSelectedEnd\"&gt;&lt;strong&gt;&lt;span&gt;Schedule&lt;/span&gt;&lt;/strong&gt;&lt;br&gt;&lt;span&gt;5:30 p.m. \u2014 Doors open&lt;/span&gt;&lt;br&gt;&lt;span&gt;6\u20137 p.m. \u2014 Presentation by Jeffrey Mansfield&lt;/span&gt;&lt;br&gt;&lt;span&gt;7\u20138 p.m. \u2014 Mingling and conversation&lt;/span&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;&lt;span&gt;Accessibility:&lt;/span&gt;&lt;/strong&gt;&lt;span&gt; ASL interpretation will be provided. JUMP is ADA accessible.&lt;/span&gt;&lt;/p&gt;\n&lt;p&gt;&lt;span&gt;&lt;strong&gt;Parking:&lt;/strong&gt;\u00a0Paid parking\u00a0is available on the 3rd and 4th levels of the JUMP parking garage. During limited hours there is available parking in Simplot&#39;s below ground parking garage. Both are accessible from the Myrtle Street entrance located between 11th and 9th Streets. Please note, the below ground parking garage is only available after 4PM until 6AM on weekdays and all day on weekends.\u00a0&lt;a rel=\"noopener noreferrer\" href=\"https://jumpboise.org/parking\" target=\"_blank\"&gt;Learn more HERE.&lt;/a&gt;&lt;/span&gt;&lt;/p&gt;\n&lt;p data-start=\"1596\" data-end=\"1749\"&gt;&lt;strong&gt;This event is free with no\u00a0registration required!&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;&lt;span data-teams=\"true\"&gt;The City of Boise is committed to ensuring equal access to all public meetings, programs, and services. Reasonable accommodations and effective communication\u2014such as ASL interpretation, materials in alternative formats and language access\u2014are available at no cost to facilitate participation. To request an accommodation, please contact us at CommunityEngagement@cityofboise.org or call 208-972-8500, TTY: 711.&lt;/span&gt;&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Image: Jeffrey Mansfield in the James Castle House Studio.\u00a0Photography by Wytske van Keulen.&lt;/p&gt;",
        "bodyText": "We hope you\u2019ll join curator Jeffrey Mansfield on November 10 from 6\u20138 p.m. at JUMP for a special presentation exploring the making of Place &amp; Perception, the current exhibition at James Castle House.\n\nAbout the Event\n\nHow does an exhibition come together? Join Jeffrey Mansfield, curator of Place &amp; Perception, for an inside look at the ideas, research, and curatorial decisions that shaped the exhibition.\n\nIn this engaging presentation, Jeffrey will share his approach to curating Place &amp; Perception and explore how the exhibition invites audiences to consider James Castle\u2019s work through the\u00a0intertwined legacies of the American West, Deafness (and disability), and modernity, alongside the many real and imagined experiences that emerge from them.\u00a0Following the presentation, attendees are invited to stay for informal conversation and mingling. Learn more about Jeffrey HERE.\u00a0\n\nEvent Details\n\nDate: November 10, 2026\n\nTime:\u00a06\u20138 p.m.\n\nLocation: JUMP, JUMP Room\n\n1000 W. Myrtle St., Boise, ID 83702\n\nSchedule\n\n5:30 p.m. \u2014 Doors open\n\n6\u20137 p.m. \u2014 Presentation by Jeffrey Mansfield\n\n7\u20138 p.m. \u2014 Mingling and conversation\n\nAccessibility: ASL interpretation will be provided. JUMP is ADA accessible.\n\nParking:\u00a0Paid parking\u00a0is available on the 3rd and 4th levels of the JUMP parking garage. During limited hours there is available parking in Simplot&#39;s below ground parking garage. Both are accessible from the Myrtle Street entrance located between 11th and 9th Streets. Please note, the below ground parking garage is only available after 4PM until 6AM on weekdays and all day on weekends.\u00a0Learn more HERE.\n\nThis event is free with no\u00a0registration required!\n\nThe City of Boise is committed to ensuring equal access to all public meetings, programs, and services. Reasonable accommodations and effective communication\u2014such as ASL interpretation, materials in alternative formats and language access\u2014are available at no cost to facilitate participation. To request an accommodation, please contact us at CommunityEngagement@cityofboise.org or call 208-972-8500, TTY: 711.\n\nImage: Jeffrey Mansfield in the James Castle House Studio.\u00a0Photography by Wytske van Keulen.",
